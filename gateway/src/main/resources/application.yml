server:
  port: 9000

spring:
  application:
    name: gateway
  cloud:
    discovery:
      client:
        simple:
          instances:
            coupon-api:
              - uri: ${COUPON_API_1_URL:http://localhost:8080}
              - uri: ${COUPON_API_2_URL:http://localhost:8081}
    gateway:
      routes:
        - id: coupon-service
          uri: lb://coupon-api
          predicates:
            - Path=/api/**
