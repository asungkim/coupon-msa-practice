spring:
  datasource:
    url: jdbc:h2:mem:test;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true

coupon:
  issue:
    strategy: atomic

notification:
  service:
    url: http://localhost:8090
    timeout-seconds: 5
  client:
    mode: sync
